<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Страница не найдена | MDF MEBEL</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#52624f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260901-light">
    <style>
        .not-found { min-height: 100vh; display: grid; place-items: center; padding: 40px var(--container-padding); }
        .not-found__inner { max-width: 720px; text-align: center; }
        .not-found__code { display: block; margin-bottom: 18px; color: var(--color-gold); font: 500 clamp(72px, 18vw, 160px)/.8 var(--font-primary); }
        .not-found h1 { margin-bottom: 20px; font: 400 clamp(34px, 6vw, 60px)/1.1 var(--font-primary); }
        .not-found p { max-width: 560px; margin: 0 auto 34px; color: var(--color-text-muted); line-height: 1.7; }
        .not-found__actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; }
    </style>
</head>
<body>
    <main class="not-found">
        <div class="not-found__inner">
            <span class="not-found__code" aria-hidden="true">404</span>
            <h1>Такой страницы нет</h1>
            <p>Возможно, адрес изменился или в ссылке есть ошибка. Вернитесь на главную или позвоните нам — поможем с проектом мебели.</p>
            <div class="not-found__actions">
                <a href="/" class="btn btn--primary">На главную</a>
                <a href="tel:+79776141414" class="btn btn--outline">Позвонить</a>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="footer__container">
            <div class="footer__bottom">
                <div class="footer__legal">
                    <p>© <span id="current-year"></span> MDF MEBEL. Все права защищены.</p>
                </div>
                <div class="footer__links">
                    <a href="mailto:restspread@gmail.com" class="developer-link">Разработка сайта: restspread</a>
                </div>
            </div>
        </div>
    </footer>
    <script>document.getElementById('current-year').textContent = new Date().getFullYear();</script>
</body>
</html>
